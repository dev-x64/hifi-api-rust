services:
  web:
    container_name: hifi-api-rust
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: /data/hifi.db
      ADMIN_KEY: ${ADMIN_KEY:-}
    ports:
      - "${HIFI_BIND:-127.0.0.1}:${HIFI_PORT:-8000}:8000"
    volumes:
      - hifi_data:/data
    init: true
    restart: unless-stopped

volumes:
  hifi_data:
